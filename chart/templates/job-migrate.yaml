{{- if .Values.migrations.enabled }}
{{- /* `alt deploy <target>` runs alterations up to <target>. A suffixed tag such as
  1.46.0-abc sorts below 1.46.0 in semver, so that version's own alterations would be
  skipped and core would then refuse to start. Allow bare X.Y.Z only. */}}
{{- $target := toString .Values.image.tag }}
{{- if not (regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" $target) }}
{{- fail (printf "image.tag %q must be a bare Logto version (X.Y.Z): the migrate Job uses it as the alteration target" $target) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aldehyde-lithium.fullname-with-suffix" (dict "root" . "arg" "migrate") }}
  labels:
    {{- include "aldehyde-lithium.labels" . | nindent 4 }}
    atomi.cloud/module: 'migrate'
  annotations: {{- include "aldehyde-lithium.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.migrationJob | default "5" }}"
    # Argo CD considers a Job healthy when it completes; next wave proceeds then.
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit | default 3 }}
  template:
    metadata:
      annotations: {{- include "aldehyde-lithium.annotations" . | nindent 8 }}
      labels:
        {{- include "aldehyde-lithium.labels" . | nindent 8 }}
        atomi.cloud/module: 'migrate'
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aldehyde-lithium.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-lc"]
          args: ["npm run cli db alt deploy {{.Values.image.tag }}"]
          envFrom:
            - configMapRef:
                name: {{ include "aldehyde-lithium.fullname" . }}-app
            - secretRef:
                name: {{ default (printf "%s-app" (include "aldehyde-lithium.fullname" .)) .Values.secrets.nameOverride }}
            - secretRef:
                name: {{ include "aldehyde-lithium.fullname-with-suffix" (dict "root" . "arg" "redis") }}
{{- end }}
