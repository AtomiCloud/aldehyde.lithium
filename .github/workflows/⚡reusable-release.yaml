name: ⚡ Reusable Release

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string

jobs:
  release:
    name: Semantic Release
    # GitHub-hosted: the AtomiCloud org no longer serves the old Namespace label
    # (nscloud-ubuntu-22.04-amd64-4x8-with-cache); same runner as AtomiCloud/primordial.
    runs-on: ubuntu-24.04
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          auth-bot-app-id: ${{ vars.AUTH_BOT_APP_ID }}
          auth-bot-secret-key: ${{ secrets.AUTH_BOT_SECRET_KEY }}
      - uses: AtomiCloud/actions.cache-npm@v2
        with:
          namespacelabs: 'false'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop .#releaser -c scripts/ci/release.sh
