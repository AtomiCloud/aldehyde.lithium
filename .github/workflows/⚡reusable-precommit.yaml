name: ⚡ Reusable Pre-Commit

on:
  workflow_call:
    inputs:
      atomi_platform:
        required: true
        type: string
      atomi_service:
        required: true
        type: string

jobs:
  precommit:
    name: Pre-Commit
    # GitHub-hosted: the AtomiCloud org no longer serves the old Namespace label
    # (nscloud-ubuntu-22.04-amd64-4x8-with-cache); same runner as AtomiCloud/primordial.
    runs-on: ubuntu-24.04
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      #

      # Pre Commit
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
